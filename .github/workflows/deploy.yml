name: Deploy site

# Push to main, the "Publish now" button (Run workflow), or every 15 minutes.
# Scheduled runs only rebuild when the Notion Site Copy changed since the last deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check Notion copy for changes
        id: copy
        run: node scripts/check-copy.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
          NOTION_COPY_TOKEN: ${{ secrets.NOTION_COPY_TOKEN }}
          NOTION_COPY_DATA_SOURCE_ID: ${{ secrets.NOTION_COPY_DATA_SOURCE_ID }}
      - name: Nothing new to publish
        if: github.event_name == 'schedule' && steps.copy.outputs.changed != 'true'
        run: echo "No copy changes; skipping deploy."
      - if: github.event_name != 'schedule' || steps.copy.outputs.changed == 'true'
        run: npm ci
      - name: Build
        if: github.event_name != 'schedule' || steps.copy.outputs.changed == 'true'
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
          RSVP_ENDPOINT: ${{ vars.RSVP_ENDPOINT }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          NOTION_COPY_TOKEN: ${{ secrets.NOTION_COPY_TOKEN }}
          NOTION_COPY_DATA_SOURCE_ID: ${{ secrets.NOTION_COPY_DATA_SOURCE_ID }}
      - if: github.event_name != 'schedule' || steps.copy.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
    outputs:
      publish: ${{ github.event_name != 'schedule' || steps.copy.outputs.changed == 'true' }}

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
